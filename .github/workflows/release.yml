# Builds the plugin for Windows (x64) first, then macOS as a universal
# (arm64 + x86_64) binary, merges both into the single cross-platform
# .bundle, codesigns + notarizes the mac binary, and publishes a GitHub
# Release with the zip and dmg attached.
#
# Run manually at the selected immutable source SHA, with no inputs.
# Source metadata determines the version; publication creates a new tag/release.
#
# Native output paths and source metadata are project-specific in .github/scripts.
# MACOS_DEPLOYMENT_TARGET must equal MACOSX_DEPLOYMENT_TARGET in the pbxproj.
# Canonical layout enforced:
#   <Product>.4dbase/Plugins/<Product>.bundle/Contents/MacOS/<Product>
#   <Product>.4dbase/Plugins/<Product>.bundle/Contents/Windows64/<Product>.4DX
#   <Product>.4dbase/Plugins/<Product>.bundle/Contents/Resources/manifest.json
#
# The macOS job never deletes the bundle: only the executable, generated plist,
# copied source localization and signature are rebuilt. The exact Windows64
# executable is replaced by the Windows artifact; runtime dylibs, QuickLook
# and other committed resources are retained. The runner's
# file system is case-insensitive, so never `rm -rf .../plugins` (lower case):
# that deletes .../Plugins too.

name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PRODUCT_NAME: etpan
  MACOS_DEPLOYMENT_TARGET: '11.5'
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:

  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set.outputs.tag }}
      version: ${{ steps.set.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - id: set
        name: read selected source and reject existing publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release.py preflight --sha "$GITHUB_SHA"

  build-windows:
    name: Build Windows (x64)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: initial clean source and publication check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release.py preflight --sha "$GITHUB_SHA"

      - name: setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # libetpan and OpenSSL are not committed: scripts/build-windows-deps.ps1
      # builds them from pinned sources. The result is cached under the
      # script's hash and saved right after the build.
      - name: restore prebuilt libraries
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            lib/windows64/*.lib
            include/windows
          key: windows-deps-${{ hashFiles('scripts/build-windows-deps.ps1') }}

      - name: build prebuilt libraries (cache miss)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: scripts/build-windows-deps.ps1 lib/windows64

      - name: save prebuilt libraries
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            lib/windows64/*.lib
            include/windows
          key: windows-deps-${{ hashFiles('scripts/build-windows-deps.ps1') }}

      - name: clean stale outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python3 .github/scripts/native.py prepare-windows
          if ($LASTEXITCODE -ne 0) { throw "Windows output cleanup failed" }

      # GitHub-hosted windows-latest ships VS2022 (v143 toolset) but not the
      # legacy v140 toolset the project may be pinned to, so we override it on
      # the command line rather than requiring an extra VS component install.
      # Same for WindowsTargetPlatformVersion=8.1 -> 10.0
      - name: build x64
        shell: cmd
        run: |
          msbuild "%PRODUCT_NAME%.sln" /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /m

      - name: normalize windows output to canonical case
        shell: pwsh
        run: |
          $product = "${{ env.PRODUCT_NAME }}"
          $base = "${{ env.PRODUCT_NAME }}.4dbase"
          $ErrorActionPreference = 'Stop'
          $canonicalDir = "$base/Plugins/$product.bundle/Contents/Windows64"
          # Exact Release|x64 OutDir from etpan.vcxproj.
          $source = "$base/plugins/$product.bundle/contents/windows64/$product.4DX"
          $destination = Join-Path $canonicalDir "$product.4DX"
          foreach ($path in @($source, $destination)) {
            $item = [System.IO.Path]::GetFullPath($path)
            while ($item -and $item -ne [System.IO.Path]::GetPathRoot($item)) {
              if (Test-Path -LiteralPath $item) {
                if ((Get-Item -LiteralPath $item -Force).Attributes -band [IO.FileAttributes]::ReparsePoint) {
                  throw "Refusing symlink/reparse output: $item"
                }
              }
              $item = Split-Path -Parent $item
            }
          }
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "Windows binary missing at exact MSBuild output: $source"
          }
          if ((Get-Item -LiteralPath $source).Length -le 0) { throw "Empty Windows output: $source" }
          New-Item -ItemType Directory -Force -Path $canonicalDir | Out-Null

          $sourceResolved = (Resolve-Path -LiteralPath $source).Path
          $destResolved = $null
          if (Test-Path -LiteralPath $destination) {
            $destResolved = (Resolve-Path -LiteralPath $destination).Path
          }

          if ($destResolved -and ($sourceResolved -ieq $destResolved)) {
            # Windows is case-insensitive: MSBuild's OutDir (lowercase, per
            # the .vcxproj) and this step's canonical path already point at
            # the identical physical file. Copy-Item correctly refuses to
            # "overwrite" a file with itself - there's nothing left to do.
            Write-Host "Already at canonical location (case-insensitive match) - skipping copy."
          } else {
            Copy-Item -LiteralPath $source -Destination $destination -Force -ErrorAction Stop
          }
          Get-ChildItem $canonicalDir

      - name: upload windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: ${{ env.PRODUCT_NAME }}.4dbase/Plugins/${{ env.PRODUCT_NAME }}.bundle/Contents/Windows64/${{ env.PRODUCT_NAME }}.4DX
          if-no-files-found: error

  build-macos:
    name: Build macOS, package, sign, notarize & release
    needs: [version, build-windows]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: initial clean source and publication check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release.py preflight --sha "$GITHUB_SHA"

      # libetpan and OpenSSL are not committed: scripts/build-macos-deps.sh
      # builds them from pinned sources. The result is cached under the
      # script's hash, and saved right after the build, so a later signing or
      # notarization failure doesn't throw the build away.
      - name: restore prebuilt libraries
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            a/*.a
            include/mac
          key: macos-deps-${{ hashFiles('scripts/build-macos-deps.sh') }}

      - name: build prebuilt libraries (cache miss)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          brew install autoconf automake libtool || true
          scripts/build-macos-deps.sh a

      - name: save prebuilt libraries
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            a/*.a
            include/mac
          key: macos-deps-${{ hashFiles('scripts/build-macos-deps.sh') }}

      - name: check prebuilt libraries
        run: |
          set -euo pipefail
          # every a/... or lib/... file the Xcode project references must be
          # committed (a gitignored a/* makes the link fail with "no such file")
          MISSING=0
          while IFS= read -r f; do
            if [ ! -e "$f" ]; then
              echo "::error::Missing prebuilt library $f"
              MISSING=1
            else
              echo "$f: $(lipo -archs "$f" 2>/dev/null || echo '?')"
            fi
          done < <(grep -o 'path = "\{0,1\}\(a\|lib\)/[^";]*' "${{ env.PRODUCT_NAME }}.xcodeproj/project.pbxproj" | sed 's/^path = "\{0,1\}//' | sort -u)
          exit $MISSING

      - name: download windows binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: winbuild

      - name: import Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo -n "$CERT_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials "notarytool-profile" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD" \
            --keychain "$KEYCHAIN_PATH"

      - name: build macOS plugin (universal)
        run: |
          set -euo pipefail
          PRODUCT="${{ env.PRODUCT_NAME }}"
          BASE="${{ env.PRODUCT_NAME }}.4dbase"
          XCODE_PROJECT="${PRODUCT}.xcodeproj"
          XCODE_TARGET="${PRODUCT}"
          PLUGINS_DIR="${BASE}/Plugins"
          python3 .github/scripts/native.py prepare-macos

          echo "Building $XCODE_PROJECT target $XCODE_TARGET"
          xcodebuild -project "$XCODE_PROJECT" \
            -target "$XCODE_TARGET" \
            -configuration Default \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET="${{ env.MACOS_DEPLOYMENT_TARGET }}" \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/$PLUGINS_DIR" \
            build

          echo "Built:"
          ls -R "$PLUGINS_DIR"

      - name: verify universal binary
        run: |
          set -euo pipefail
          python3 .github/scripts/native.py verify --version "${{ needs.version.outputs.version }}"

      - name: merge Windows binaries into the bundle
        run: |
          set -euo pipefail
          PRODUCT="${{ env.PRODUCT_NAME }}"
          BASE="${{ env.PRODUCT_NAME }}.4dbase"
          BUNDLE="${BASE}/Plugins/${PRODUCT}.bundle"

          python3 .github/scripts/native.py merge-windows

          echo "BUNDLE_PATH=$BUNDLE" >> "$GITHUB_ENV"
          ls -R "$BUNDLE/Contents"

      - name: codesign
        run: |
          set -euo pipefail
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)".*/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          echo "Signing with: $IDENTITY"
          codesign --verbose --deep --timestamp --force --options=runtime \
            --sign "$IDENTITY" "$BUNDLE_PATH"
          codesign --verify --deep --strict --verbose=2 "$BUNDLE_PATH"

      - name: package, notarize & staple
        run: |
          set -euo pipefail
          PRODUCT="${{ env.PRODUCT_NAME }}"
          VERSION="${{ needs.version.outputs.version }}"
          ZIP_PATH="${PRODUCT}-${VERSION}.zip"
          DMG_PATH="${PRODUCT}-${VERSION}.dmg"
          test ! -e "$ZIP_PATH"
          test ! -e "$DMG_PATH"

          # zip: cross-platform bundle (win + mac binaries together), what most users grab
          echo "Creating $ZIP_PATH"
          ditto -c -k --keepParent "$BUNDLE_PATH" "$ZIP_PATH"

          # dmg: mac-friendly, and the only format Apple lets us staple a ticket to
          echo "Creating $DMG_PATH"
          hdiutil create -format UDBZ -volname "$PRODUCT" -srcfolder "$BUNDLE_PATH" "$DMG_PATH"

          # submit and wait; on anything but Accepted, print Apple's log and fail
          # (notarytool submit --wait exits 0 even when the status is Invalid)
          notarize() {
            local OUT ID STATUS
            OUT=$(xcrun notarytool submit "$1" --keychain-profile "notarytool-profile" --keychain "$KEYCHAIN_PATH" \
              --wait --output-format json)
            echo "$OUT"
            ID=$(plutil -extract id raw -o - - <<< "$OUT" 2>/dev/null || true)
            STATUS=$(plutil -extract status raw -o - - <<< "$OUT" 2>/dev/null || true)
            if [ "$STATUS" != "Accepted" ]; then
              echo "::error::Notarization of $1 returned '${STATUS:-no status}'"
              if [ -n "$ID" ]; then
                xcrun notarytool log "$ID" --keychain-profile "notarytool-profile" --keychain "$KEYCHAIN_PATH" || true
              fi
              return 1
            fi
          }

          notarize "$ZIP_PATH"
          notarize "$DMG_PATH"
          xcrun stapler staple "$DMG_PATH"
          codesign --verify --deep --strict --verbose=2 "$BUNDLE_PATH"

          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"
          ls -lh "$ZIP_PATH" "$DMG_PATH"

      - name: create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release.py publish --sha "$GITHUB_SHA" "$ZIP_PATH" "$DMG_PATH"
